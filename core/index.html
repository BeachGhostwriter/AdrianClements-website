<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Core Application</title>
    <style>
      body { font-family: Segoe UI, Arial, sans-serif; margin: 0; background: #f7fbf8; color: #223127; }
      .wrap { max-width: 720px; margin: 80px auto; padding: 32px; background: white; border-radius: 16px; box-shadow: 0 14px 30px rgba(0,0,0,0.08); }
      input { width: 100%; padding: 12px; margin-top: 10px; border: 1px solid #cfe4d2; border-radius: 8px; }
      button { margin-top: 16px; padding: 10px 16px; border: none; border-radius: 8px; background: #2f6b3d; color: white; cursor: pointer; }
      .hint { color: #5d6d5f; font-size: 0.95rem; margin-top: 10px; }
      .error { color: #b13b3b; margin-top: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Core Application</h1>
      <p>This area is password protected.</p>
      <input id="password" type="password" placeholder="Enter password" />
      <button onclick="checkPassword()">Access</button>
      <div class="hint">Hint: use your approved access code. After access, choose Live or Demo.</div>
      <div id="app-links" style="display:none; margin-top: 18px; gap: 10px; flex-wrap: wrap;">
        <a id="live-link" href="#" style="display:inline-block; padding:10px 14px; border-radius:8px; text-decoration:none; background:#2f6b3d; color:#fff;">Open Live CORE Platform</a>
        <a id="demo-link" href="#" style="display:inline-block; padding:10px 14px; border-radius:8px; text-decoration:none; border:1px solid #2f6b3d; color:#2f6b3d;">Open Demo CORE</a>
      </div>
      <div id="error" class="error"></div>
    </div>
    <script>
      async function checkPassword() {
        const pass = document.getElementById('password').value;
        if (!pass) {
          document.getElementById('error').textContent = 'Please enter your password.';
          return;
        }

        try {
          const response = await fetch('/api/core-access', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ accessCode: pass }),
          });

          const payload = await response.json();
          if (!response.ok || !payload.success) {
            document.getElementById('error').textContent = payload.message || 'Incorrect password.';
            return;
          }

          document.getElementById('error').textContent = '';
          const live = document.getElementById('live-link');
          const demo = document.getElementById('demo-link');
          live.href = payload.data.liveUrl || '#';
          demo.href = payload.data.demoUrl || '../core.html';
          document.getElementById('app-links').style.display = 'flex';
        } catch {
          document.getElementById('error').textContent = 'Could not verify access. Please try again.';
        }
      }
    </script>
  </body>
</html>
